[package]
name = "homewright-zaptec"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Zaptec-ladebokse som ekstern integration til HomewrightHQ"
publish = false

[[bin]]
name = "zaptec"
path = "src/main.rs"

[dependencies]
homewright-plugin = { package = "thehome-plugin", git = "https://github.com/magnusdunker/homewrighthq-example-integration-rust", rev = "a8f05c1859f6689b2a31d2188593eb872408385e" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# keeps the field order of setup forms
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
